name: ci

# What CI can and cannot do here, and what it costs.
#
# There is no dataset to download: every image in this repository is rendered
# from a seed by `scripts/make_dataset.py`.  That is unusually good for CI --
# it means the whole pipeline can run end to end on a clean runner with no
# network access beyond pip -- and unusually bad for CI *minutes*, because
# rendering is the expensive step.
#
# So the split is:
#
#   this workflow        lint, the unit tests, and `scripts/demo.py`, which
#                        renders a miniature capture and runs calibration,
#                        reconstruction and pose estimation over it end to end.
#                        Then the GenICam capture path against three of
#                        Aravis's simulated GigE Vision cameras on the runner's
#                        loopback interface: the GenICam tests (required, not
#                        skipped) and `scripts/genicam_demo.py`, which captures
#                        a rendered three-camera capture over GigE Vision and
#                        runs the same pipeline on what arrives.  Simulated:
#                        there is no camera hardware anywhere in this.
#                        It does not train the pose-refinement network or run
#                        the ablation; see the README.
#
#   `make experiments`   the full capture and every number quoted in the
#                        README.  About forty minutes, run on a workstation,
#                        with the result records committed under
#                        results/published/ so they can be checked without
#                        re-running them.
#
# Cost control, because this runs on a free account:
#
#   * One job, one Python version.  A version matrix doubles or triples the
#     minutes to tell you something that changes about twice a year, so the
#     older interpreter is checked on a weekly schedule instead.
#   * `concurrency` cancels superseded runs, so pushing three times in five
#     minutes costs one run and not three.
#   * pip is cached on the hash of requirements.txt, which takes installation
#     from about three minutes to about twenty seconds.
#   * Torch comes from the CPU wheel index.  The default PyPI wheel pulls the
#     whole CUDA stack, which is well over a gigabyte to download and install
#     on a runner that has no GPU.
#   * `paths-ignore` skips the whole thing for documentation-only commits.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
  # Weekly, for the older-interpreter job below.  Monday morning, so a break
  # has the week to be noticed rather than the weekend.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned rather than ubuntu-latest: the Aravis build and PyGObject compile
    # against this image's system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARAVIS_PREFIX: /home/runner/aravis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-genicam.txt

      # Open3D links against EGL and OpenGL even in a headless build and the
      # runner image does not carry them, so `import open3d` fails with
      # "libEGL.so.1: cannot open shared object file".  About five seconds.
      - name: System libraries Open3D needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgomp1

      # Aravis 0.8.36, built from its checksummed release tarball, plus the
      # scene camera.  Cached on the build script and the scene camera's
      # source, so this is a restore unless one of them changed.
      - name: Cache the Aravis build
        id: aravis-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ARAVIS_PREFIX }}
          key: aravis-${{ runner.os }}-24.04-${{ hashFiles('scripts/genicam/setup_aravis.sh', 'capture/fakecam/arv-scene-gv-camera.c') }}

      - name: Aravis and the simulated GigE Vision cameras
        run: |
          # Build tools and headers: Aravis needs them on a cache miss and the
          # PyGObject build below needs them every time.
          scripts/genicam/setup_aravis.sh apt
          scripts/genicam/setup_aravis.sh build
          scripts/genicam/setup_aravis.sh env >> "$GITHUB_ENV"
          echo "$ARAVIS_PREFIX/bin" >> "$GITHUB_PATH"
          # One loopback address per simulated camera plus receive buffers
          # big enough for a frame burst, as on any GigE Vision host.
          scripts/genicam/loopback_addresses.sh 3
          sudo sysctl -w net.core.rmem_max=16777216

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel drags in the CUDA runtime, which
          # is about 2 GB of download for a runner with no GPU in it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-genicam.txt

      - name: Lint
        run: python -m flake8 src/ tests/ scripts/ capture/

      - name: Tests
        env:
          # The GenICam tests fail rather than skip if Aravis is not usable.
          MULTICAM_REQUIRE_GENICAM: '1'
        run: python -m pytest tests/ -q --durations=10

      - name: The whole pipeline, end to end, on a capture rendered in-process
        run: python scripts/demo.py --out /tmp/demo.json

      - name: The demo produced the numbers it claims to
        run: |
          python - <<'PY'
          import json
          d = json.load(open("/tmp/demo.json"))
          assert not d["failures"], d["failures"]
          m = d["measured"]
          # Re-assert the two that matter most, so a change to LIMITS that
          # quietly loosens them still has to get past this file as well.
          assert m["extrinsic_rmse_px"] < 1.0, m
          assert m["pose_translation_mm"] < 25.0, m
          print("demo ok:", json.dumps({k: round(v, 4) for k, v in m.items()}, indent=2))
          PY

      - name: The pipeline fed over GigE Vision from three simulated cameras
        run: python scripts/genicam_demo.py --out /tmp/genicam.json

      - name: Upload the demo record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-record
          path: |
            /tmp/demo.json
            /tmp/genicam.json
          retention-days: 7
          if-no-files-found: ignore

  # The older interpreter, once a week rather than on every push.  It catches a
  # genuine incompatibility within seven days and costs about four minutes a
  # week instead of four minutes a commit.
  oldest-python:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries Open3D needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgomp1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/ -q
