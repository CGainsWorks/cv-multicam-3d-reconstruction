[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    slow: whole-pipeline or statistical tests that take tens of seconds.
        `make test-fast` skips them; `make check` and CI do not.
    genicam: runs against Aravis's simulated GigE Vision cameras.  Needs Linux,
        Aravis and the loopback addresses; skipped without them, except in CI.
filterwarnings =
    error::DeprecationWarning:multicam.*
